title: Cron keeps running when its parent conversation is archived

scenario:
  id: cron-archived-parent-continues
  surface: cron
  coverage:
    primary:
      - automation.isolated-cron-execution
    secondary:
      - automation.manual-cron-runs
  objective: Verify an automation linked to the conversation that created it keeps running, enabled, after that conversation is archived.
  successCriteria:
    - A job created for an existing conversation runs normally while that conversation is current.
    - After the conversation is archived, a forced run still succeeds and reaches the model.
    - The job stays enabled: archiving hides a conversation from lists and is not a request to stop its automations.
  docsRefs:
    - docs/automation/cron-jobs.md
  codeRefs:
    - src/cron/execution-context.ts
    - src/cron/execution-context-admission.ts
    - src/cron/service/occurrence-admission.ts
    - src/cron/service/timer-outcomes.ts
  execution:
    kind: flow
    suiteIsolation: isolated
    isolationReason: Archives the job's parent conversation.
    channel: qa-channel
    retryCount: 0
    timeoutMs: 240000
    summary: Create a conversation, create an isolated job bound to it, archive the conversation, and prove the next forced run still runs with the job enabled.
    config:
      requiredProviderMode: mock-openai
      conversationId: qa-cron-archived-parent
      readyMarker: QA-CRON-PARENT-READY

flow:
  steps:
    - name: creates a job bound to a live conversation
      actions:
        - assert:
            expr: "env.providerMode === config.requiredProviderMode"
            message: archived parent proof requires mock-openai
        - call: waitForGatewayHealthy
          args:
            - ref: env
            - 60000
        - call: waitForQaChannelReady
          args:
            - ref: env
            - 60000
        - call: reset
        - set: parentSessionKey
          value:
            expr: "`agent:qa:qa-channel:group:group:${config.conversationId}`"
        - sendInbound:
            conversation:
              id:
                ref: config.conversationId
              kind: group
            senderId: qa-driver
            senderName: QA Driver
            text:
              expr: "`@openclaw Cron parent QA check: ready. Reply exactly \\`${config.readyMarker}\\`.`"
        - call: waitForCondition
          args:
            - lambda:
                expr: "state.getSnapshot().messages.some((message) => message.direction === 'outbound' && !message.deleted && message.conversation.id === config.conversationId && message.text.includes(config.readyMarker)) || undefined"
            - 60000
            - 100
        - call: env.gateway.call
          saveAs: added
          args:
            - cron.add
            - agentId: qa
              sessionKey:
                ref: parentSessionKey
              name:
                expr: "`qa-cron-archived-parent-${randomUUID()}`"
              enabled: true
              deleteAfterRun: false
              schedule:
                kind: every
                everyMs: 3600000
              sessionTarget: isolated
              wakeMode: now
              payload:
                kind: agentTurn
                message: Cron parent QA check, reply with a short status line.
              delivery:
                mode: none
            - timeoutMs: 30000
        - set: jobId
          value:
            expr: added.id
        - set: firstRunStartedAt
          value:
            expr: "Date.now()"
        - call: env.gateway.call
          args:
            - cron.run
            - id:
                ref: jobId
              mode: force
            - timeoutMs: 30000
        - call: waitForCronRunCompletion
          saveAs: firstRun
          args:
            - callGateway:
                expr: "env.gateway.call.bind(env.gateway)"
              jobId:
                ref: jobId
              afterTs:
                ref: firstRunStartedAt
        - assert:
            expr: "firstRun.status === 'ok'"
            message:
              expr: "`run with a current parent did not succeed: ${JSON.stringify(firstRun)}`"

    - name: archiving the parent leaves the job running
      actions:
        - call: env.gateway.call
          saveAs: described
          args:
            - sessions.describe
            - key:
                ref: parentSessionKey
              agentId: qa
            - timeoutMs: 30000
        - call: env.gateway.call
          args:
            - sessions.patch
            - key:
                ref: parentSessionKey
              expectedSessionId:
                expr: described.session.sessionId
              archived: true
            - timeoutMs: 30000
        - set: jobPromptRequestsBefore
          value:
            expr: "[...(await fetchJson(`${env.mock.baseUrl}/debug/requests`))].filter((request) => String(request.prompt ?? '').includes('Cron parent QA check, reply with a short status line.')).length"
        - assert:
            expr: "jobPromptRequestsBefore >= 1"
            message: the run with a current parent never reached the model
        - set: archivedRunStartedAt
          value:
            expr: "Date.now()"
        - call: env.gateway.call
          args:
            - cron.run
            - id:
                ref: jobId
              mode: force
            - timeoutMs: 30000
        - call: waitForCronRunCompletion
          saveAs: archivedRun
          args:
            - callGateway:
                expr: "env.gateway.call.bind(env.gateway)"
              jobId:
                ref: jobId
              afterTs:
                ref: archivedRunStartedAt
        - assert:
            expr: "archivedRun.status === 'ok'"
            message:
              expr: "`run with an archived parent did not succeed: ${JSON.stringify(archivedRun)}`"
        - call: env.gateway.call
          saveAs: archivedJob
          args:
            - cron.get
            - id:
                ref: jobId
            - timeoutMs: 30000
        - assert:
            expr: "archivedJob.enabled === true"
            message:
              expr: "`archiving the parent disabled the job: ${JSON.stringify(archivedJob)}`"
        # Final-effect check: the occurrence after archiving reached the model.
        - set: jobPromptRequestsAfter
          value:
            expr: "[...(await fetchJson(`${env.mock.baseUrl}/debug/requests`))].filter((request) => String(request.prompt ?? '').includes('Cron parent QA check, reply with a short status line.')).length"
        - assert:
            expr: "jobPromptRequestsAfter > jobPromptRequestsBefore"
            message:
              expr: "`run with an archived parent never reached the model: ${jobPromptRequestsBefore} -> ${jobPromptRequestsAfter}`"
